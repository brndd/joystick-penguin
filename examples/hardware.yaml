# Replace the stable path; button 1 is the first advertised joystick button.
version: 1
devices:
  physical:
    kind: evdev
    path: /dev/input/by-id/example-event-joystick
    grab: true
  virtual:
    kind: uinput
    preset: joystick
modes: {initial: default, names: [default]}
bindings:
  - input: {device: physical, button: 1}
    modes: [default]
    action: {type: button, device: virtual, button: 1}
