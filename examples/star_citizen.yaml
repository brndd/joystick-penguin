# Port of ~/build/joyful/sc_profile/ for two VKB Gladiator EVO sticks.
# Buttons are one-based: Joyful's button index N becomes button N+1 here.
# Physical button numbers follow each device's advertised joystick controls.
# Both virtual devices advertise all 79 buttons from the joystick preset.
# Joyful's temporary Modifier mode is a held layer on left button 5.
# Names, mode lists and button remaps follow the Joyful profile.
version: 1
devices:
  left:
    kind: evdev
    path: /dev/input/by-id/usb-VKB-Sim__C__Alex_Oz_2023_VKBsim_Gladiator_EVO_OT_L-event-joystick
  right:
    kind: evdev
    path: /dev/input/by-id/usb-VKB-Sim__C__Alex_Oz_2023_VKBsim_Gladiator_EVO_R-event-joystick
  left-vjoy:
    kind: uinput
    preset: joystick
    name: jp-left-vjoy
    bus: usb
    vendor_id: 0x4711
    product_id: 0x0817
    axes:
      4: {min: 0, max: 2047, neutral: 1024}
      5: {min: 0, max: 2047, neutral: 0}
  right-vjoy:
    kind: uinput
    preset: joystick
    name: jp-right-vjoy
    bus: usb
    vendor_id: 0x4711
    product_id: 0x0818
    axes:
      4: {min: 0, max: 2047, neutral: 1024}
      5: {min: 0, max: 2047, neutral: 0}
modes: {initial: SCM Mode, names: [SCM Mode, Auxiliary Mode, Nav Mode]}
modifiers:
  leftmod: {inputs: [{device: left, button: 5}]}
bindings:
  # Physical ABS_RX/RY mini-stick -> virtual ABS_Z/RX; twist -> ABS_RY.
  # Linux ABS_X/Y/Z/RX/RY/RZ codes are 0/1/2/3/4/5.
  - {input: {device: left, axis: 3}, modes: &base [SCM Mode, Auxiliary Mode, Nav Mode], action: {type: axis, device: left-vjoy, axis: 2}}
  - {input: {device: left, axis: 4}, modes: *base, action: {type: axis, device: left-vjoy, axis: 3, invert: true}}
  - {input: {device: left, axis: 5}, modes: *base, action: {type: axis, device: left-vjoy, axis: 4}}
  - {input: {device: left, axis: 0}, modes: *base, action: {type: axis, device: left-vjoy, axis: 0}}
  - {input: {device: left, axis: 1}, modes: *base, action: {type: axis, device: left-vjoy, axis: 1, invert: true}}
  - {input: {device: left, axis: 2}, modes: *base, action: {type: axis, device: left-vjoy, axis: 5, invert: true}}
  - {input: {device: right, axis: 3}, modes: *base, action: {type: axis, device: right-vjoy, axis: 2}}
  - {input: {device: right, axis: 4}, modes: *base, action: {type: axis, device: right-vjoy, axis: 3, invert: true}}
  - {input: {device: right, axis: 5}, modes: *base, action: {type: axis, device: right-vjoy, axis: 4, invert: true}}
  - {input: {device: right, axis: 0}, modes: *base, action: {type: axis, device: right-vjoy, axis: 0}}
  - {input: {device: right, axis: 1}, modes: *base, action: {type: axis, device: right-vjoy, axis: 1}}
  - {input: {device: right, axis: 2}, modes: *base, action: {type: axis, device: right-vjoy, axis: 5, invert: true}}

  # Left trigger, A2, B1; the leftmod button itself has no virtual output.
  - {input: {device: left, button: 1}, modes: *base, action: {type: button, device: left-vjoy, button: 1}}
  - {input: {device: left, button: 1}, modes: *base, modifiers: &leftmod [leftmod], action: {type: button, device: left-vjoy, button: 31}}
  - {input: {device: left, button: 2}, modes: *base, action: {type: button, device: left-vjoy, button: 2}}
  - {input: {device: left, button: 2}, modes: *base, modifiers: *leftmod, action: {type: button, device: left-vjoy, button: 32}}
  - {input: {device: left, button: 3}, modes: *base, modifiers: *leftmod, action: {type: button, device: left-vjoy, button: 33}}
  # L-A2: tap button 3; hold selects a persistent mode and asserts remapped buttons.
  - input: {device: left, button: 3}
    modes: [SCM Mode]
    threshold_ms: 500
    tap: {action: {type: button, device: left-vjoy, button: 3}}
    hold:
      actions:
        - {type: button, device: left-vjoy, button: 63}
        - {type: mode, mode: Nav Mode}
  - input: {device: left, button: 3}
    modes: [Auxiliary Mode]
    threshold_ms: 500
    tap: {action: {type: button, device: left-vjoy, button: 3}}
    hold:
      actions:
        - {type: button, device: left-vjoy, button: 61}
        - {type: button, device: left-vjoy, button: 64}
        - {type: mode, mode: SCM Mode}
  - input: {device: left, button: 3}
    modes: [Nav Mode]
    threshold_ms: 500
    tap: {action: {type: button, device: left-vjoy, button: 3}}
    hold:
      actions:
        - {type: button, device: left-vjoy, button: 64}
        - {type: mode, mode: SCM Mode}
  - {input: {device: left, button: 4}, modes: *base, action: {type: button, device: left-vjoy, button: 4}}
  - {input: {device: left, button: 4}, modes: *base, modifiers: *leftmod, action: {type: button, device: left-vjoy, button: 34}}

  # L-A3 directions/press; L-A4 directions/press.
  - {input: {device: left, button: 6}, modes: *base, action: {type: button, device: left-vjoy, button: 11}}
  - {input: {device: left, button: 6}, modes: *base, modifiers: *leftmod, action: {type: button, device: left-vjoy, button: 41}}
  - {input: {device: left, button: 7}, modes: *base, action: {type: button, device: left-vjoy, button: 12}}
  - {input: {device: left, button: 7}, modes: *base, modifiers: *leftmod, action: {type: button, device: left-vjoy, button: 42}}
