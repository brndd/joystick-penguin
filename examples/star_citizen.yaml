  - input: {device: right, button: 3}
    modes: [Auxiliary Mode]
    threshold_ms: 500
    tap: {action: {type: button, device: right-vjoy, button: 3}}
    hold: {action: {type: button, device: left-vjoy, button: 60}}
  - input: {device: right, button: 3}
