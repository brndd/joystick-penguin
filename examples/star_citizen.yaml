  - {input: {device: left, button: 11}, modes: *base, modifiers: *leftmod, action: {type: button, device: left-vjoy, button: 36}}
  - {input: {device: left, button: 12}, modes: *base, action: {type: button, device: left-vjoy, button: 7}}
  - {input: {device: left, button: 12}, modes: *base, modifiers: *leftmod, action: {type: button, device: left-vjoy, button: 37}}
  - {input: {device: left, button: 13}, modes: *base, action: {type: button, device: left-vjoy, button: 8}}
  - {input: {device: left, button: 13}, modes: *base, modifiers: *leftmod, action: {type: button, device: left-vjoy, button: 38}}
  - {input: {device: left, button: 14}, modes: *base, action: {type: button, device: left-vjoy, button: 9}}
  - {input: {device: left, button: 14}, modes: *base, modifiers: *leftmod, action: {type: button, device: left-vjoy, button: 39}}
  - {input: {device: left, button: 15}, modes: *base, action: {type: button, device: left-vjoy, button: 10}}
  - {input: {device: left, button: 15}, modes: *base, modifiers: *leftmod, action: {type: button, device: left-vjoy, button: 40}}

