  - {input: {device: left, button: 8}, modes: *base, modifiers: *leftmod, action: {type: button, device: left-vjoy, button: 43}}
  - {input: {device: left, button: 9}, modes: *base, action: {type: button, device: left-vjoy, button: 14}}
  - {input: {device: left, button: 9}, modes: *base, modifiers: *leftmod, action: {type: button, device: left-vjoy, button: 44}}
  - {input: {device: left, button: 10}, modes: *base, action: {type: button, device: left-vjoy, button: 15}}
  - {input: {device: left, button: 10}, modes: *base, modifiers: *leftmod, action: {type: button, device: left-vjoy, button: 45}}
