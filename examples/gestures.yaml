# Replace the stable path with that of your controller.
# On a VKB Gladiator: A=button 1, Shift=button 5, B=button 3.
version: 1
devices:
  physical:
    kind: evdev
    path: /dev/input/by-id/example-event-joystick
    grab: true
  virtual:
    kind: uinput
    preset: joystick
modes: {initial: default, names: [default]}
modifiers:
  shift:
    input: {device: physical, button: 5}
bindings:
  - input: {device: physical, button: 1} # A: ordinary
    modes: [default]
    action: {type: button, device: virtual, button: 1}
  - input: {device: physical, button: 1} # New A while shift is held
    modes: [default]
    modifiers: [shift]
    action: {type: button, device: virtual, button: 5}
  - input: {device: physical, button: 5} # Modifier's own output
    modes: [default]
    action: {type: button, device: virtual, button: 6}
  - input: {device: physical, button: 3} # B: ordinary fallback
    modes: [default]
    action: {type: button, device: virtual, button: 3}
  - input: {device: physical, button: 3} # B: modified, two actions
    modes: [default]
    modifiers: [shift]
    actions:
      - {type: button, device: virtual, button: 4}
      - {type: button, device: virtual, button: 7}
