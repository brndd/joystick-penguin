# Replace the stable path and input codes with those of your controller.
# Buttons are one-based; axis numbers are Linux EV_ABS codes.
version: 1
devices:
  physical: {kind: evdev, path: /dev/input/by-id/example-event-joystick}
  virtual:
    kind: uinput
    preset: joystick
    axes:
      0: {min: -32768, max: 32767, neutral: 0}
      1: {min: -32768, max: 32767, neutral: 0}
modes: {initial: default, names: [default, alternate]}
bindings:
  - input: {device: physical, button: 1}
    modes: [default]
    action: {type: button, device: virtual, button: 1}
  - input: {device: physical, button: 1}
    modes: [alternate]
    action: {type: button, device: virtual, button: 2}
  - input: {device: physical, axis: 0}
    modes: [default]
    action: {type: axis, device: virtual, axis: 0}
  - input: {device: physical, axis: 0}
    modes: [alternate]
    action: {type: axis, device: virtual, axis: 1}
  - input: {device: physical, button: 5}
    modes: [default, alternate]
    threshold_ms: 200
    tap_ms: 50
    tap: {action: {type: button, device: virtual, button: 7}}
    hold:
      actions:
        - {type: button, device: virtual, button: 8}
        - {type: mode, mode: alternate}
  - input: {device: physical, button: 6}
    modes: [default, alternate]
    action: {type: mode, mode: default}
