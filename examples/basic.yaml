# One-based button numbers are device-relative on input and preset-relative on output.
version: 1
devices:
  physical:
    kind: evdev
    path: /dev/input/by-id/example-event-joystick
    grab: true
  virtual:
    kind: uinput
    preset: joystick
modes:
  initial: default
  names: [default, alternate]
modifiers:
  shift:
    input: {device: physical, button: 4}
bindings:
  - input: {device: physical, button: 1}
    modes: [default, alternate]
    action: {type: button, device: virtual, button: 2}
  - input: {device: physical, button: 1}
    modes: [default, alternate]
    modifiers: [shift]
    action: {type: button, device: virtual, button: 4}
